name: Chart Designer Pro

# Builds and packs Chart Designer Pro on every change. Publishes to nuget.org (Trusted Publishing)
# and creates a GitHub release when:
#   - a push to main carries a version that isn't on nuget.org yet (bump the version → release), or
#   - a tag like "ChartDesignerPro-v1.2026.10.1" is pushed.
on:
  push:
    branches: [ main ]
    paths: [ 'ChartDesignerPro/**', '.github/workflows/chart-designer-pro.yml' ]
    tags: [ 'ChartDesignerPro-v*' ]
  pull_request:
    paths: [ 'ChartDesignerPro/**', '.github/workflows/chart-designer-pro.yml' ]
  workflow_dispatch:

permissions:
  contents: write   # create the GitHub release on tags
  id-token: write   # nuget.org Trusted Publishing (OIDC): no API key stored anywhere

env:
  PROJECT: ChartDesignerPro/src/ChartDesignerPro/ChartDesignerPro.csproj
  NUSPEC: ChartDesignerPro/src/ChartDesignerPro/ChartDesignerPro.nuspec

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Check versions match
        id: version
        shell: pwsh
        run: |
          [xml]$csproj = Get-Content $env:PROJECT
          [xml]$spec   = Get-Content $env:NUSPEC
          $projVersion = ($csproj.Project.PropertyGroup | Where-Object { $_.Version } | Select-Object -First 1).Version
          $specVersion = $spec.package.metadata.version
          if ($projVersion -ne $specVersion) { throw "Version mismatch: csproj=$projVersion, nuspec=$specVersion" }
          if ($env:GITHUB_REF -like 'refs/tags/ChartDesignerPro-v*') {
            $tagVersion = $env:GITHUB_REF -replace '^refs/tags/ChartDesignerPro-v', ''
            if ($tagVersion -ne $specVersion) { throw "Tag version $tagVersion doesn't match package version $specVersion" }
          }
          "version=$specVersion" >> $env:GITHUB_OUTPUT
          Write-Host "Chart Designer Pro version $specVersion"

      - name: Core tests
        run: dotnet run --project ChartDesignerPro/tests/ChartDesignerPro.Tests/ChartDesignerPro.Tests.csproj -c Release

      - name: Build (Release)
        run: dotnet build ${{ env.PROJECT }} -c Release -p:CopyToXrmToolBox=false

      - name: Pack
        shell: pwsh
        run: |
          $projectDir = Split-Path $env:PROJECT
          dotnet pack $env:PROJECT -c Release --no-build -o artifacts `
            "-p:NuspecFile=$((Resolve-Path $env:NUSPEC).Path)" `
            "-p:NuspecBasePath=$((Resolve-Path $projectDir).Path)"
          Get-ChildItem artifacts

      - name: Check package layout
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $pkg = Get-ChildItem artifacts/*.nupkg | Select-Object -First 1
          $zip = [IO.Compression.ZipFile]::OpenRead($pkg.FullName)
          $entries = $zip.Entries.FullName
          $zip.Dispose()
          $entries | ForEach-Object { Write-Host "  $_" }
          foreach ($required in 'lib/net48/Plugins/ChartDesignerPro.dll', 'docs/README.md') {
            if ($entries -notcontains $required) { throw "Package is missing $required" }
          }

      - uses: actions/upload-artifact@v4
        with:
          name: ChartDesignerPro-nupkg-${{ steps.version.outputs.version }}
          path: artifacts/*.nupkg

      - name: Decide whether to publish
        id: release
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $publish = $false
          if ($env:GITHUB_REF -like 'refs/tags/ChartDesignerPro-v*') { $publish = $true }
          elseif ($env:GITHUB_EVENT_NAME -eq 'push' -and $env:GITHUB_REF -eq 'refs/heads/main') {
            $id = 'vikashkumar.xrmtoolbox.chartdesignerpro'
            try {
              $published = (Invoke-RestMethod "https://api.nuget.org/v3-flatcontainer/$id/index.json").versions
            } catch { $published = @() }   # 404 until the first version exists
            $publish = -not ($published -contains $version.ToLowerInvariant())
            Write-Host "Already on nuget.org: $($published -join ', ')"
          }
          Write-Host "Publish $version : $publish"
          "publish=$($publish.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

      # nuget.org copies the icon from iconUrl when it validates the package and never fetches it again. If the URL can't be
      # read (for example while the repository is private), the version has no icon and the XrmToolBox portal refuses it.
      - name: Check icon URL
        if: steps.release.outputs.publish == 'true'
        shell: pwsh
        run: |
          # The URL must serve this commit's icon (GitHub's raw server caches files for up to 5 minutes after a change),
          # so wait until it does before nuget.org copies it.
          [xml]$spec = Get-Content $env:NUSPEC
          $url = $spec.package.metadata.iconUrl
          $local = (Get-FileHash ChartDesignerPro/src/ChartDesignerPro/Resources/icon128.png -Algorithm SHA256).Hash
          $deadline = (Get-Date).AddMinutes(10)
          while ($true) {
            try { $r = Invoke-WebRequest "$url" -Method Get -UseBasicParsing -Headers @{ 'Cache-Control' = 'no-cache' } } catch { throw "Icon URL $url can't be read ($($_.Exception.Message)). Is the repository public?" }
            if ($r.StatusCode -ne 200 -or $r.Headers['Content-Type'] -notlike 'image/png*') { throw "Icon URL $url returned $($r.StatusCode) $($r.Headers['Content-Type']); expected 200 image/png" }
            $sha = [System.Security.Cryptography.SHA256]::Create()
            $remote = -join ($sha.ComputeHash($r.Content) | ForEach-Object { $_.ToString('X2') })
            if ($remote -eq $local) { Write-Host "Icon URL OK: $url serves this commit's icon ($($r.RawContentLength) bytes)"; break }
            if ((Get-Date) -gt $deadline) { throw "Icon URL $url still serves a different icon after 10 minutes" }
            Write-Host "Icon URL still serves the previous icon (cache); waiting 30 s"
            Start-Sleep -Seconds 30
          }

      # nuget.org Trusted Publishing: exchanges GitHub's OIDC token for a one-hour API key.
      # Policy on nuget.org: owner VikashKumar0491, repo vikashkumar669/XrmTools, workflow chart-designer-pro.yml
      # (create this policy on nuget.org before the first release, or the login step fails)
      - name: NuGet login (Trusted Publishing)
        if: steps.release.outputs.publish == 'true'
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: VikashKumar0491

      - name: Push to nuget.org
        if: steps.release.outputs.publish == 'true'
        shell: pwsh
        env:
          NUGET_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          $pkg = (Get-ChildItem artifacts/*.nupkg | Select-Object -First 1).FullName
          $out = dotnet nuget push $pkg --api-key $env:NUGET_KEY --source https://api.nuget.org/v3/index.json --skip-duplicate 2>&1
          $code = $LASTEXITCODE
          $out | ForEach-Object { Write-Host $_ }
          if ($code -ne 0) {
            # Surface nuget.org's reason as annotations (visible without downloading logs)
            $out | Where-Object { $_ -match 'error|Response status|forbidden|denied|invalid|400|401|403|409' } |
              Select-Object -First 8 | ForEach-Object { Write-Host "::error title=nuget push::$_" }
            exit $code
          }

      - name: Create GitHub release
        if: steps.release.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ChartDesignerPro-v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Chart Designer Pro ${{ steps.version.outputs.version }}
          files: artifacts/*.nupkg
          body: |
            Chart Designer Pro ${{ steps.version.outputs.version }}, also available in XrmToolBox → Tool Library once nuget.org has indexed it.
            See the [release notes](https://github.com/vikashkumar669/XrmTools/tree/main/ChartDesignerPro#release-notes).
